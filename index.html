<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="page-wrapper">
    <header class="hero">
      <div class="brand">
        <img src="assets/images/logo.svg" alt="Hello World Logo" class="brand-logo" />
        <div>
          <h1>Hello World</h1>
          <p class="hero-description">
            Eine moderne Startseite mit einfachem JavaScript-Effekt und klarer Struktur.
          </p>
        </div>
      </div>

      <button id="magicButton" class="primary-button" type="button">
        Klick mich!
      </button>

      <p id="message" class="feedback-message" aria-live="polite">
        Bereit für einen kleinen Effekt?
      </p>
    </header>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
